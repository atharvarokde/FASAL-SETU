services:
  - type: web
    name: fasalsetu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    disk: {name: data, mountPath: /var/data, sizeGB: 1}
    envVars:
      - {key: AGRI_DB, value: /var/data/fasalsetu.db}
